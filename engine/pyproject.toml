[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uthm-atlas-engine"
version = "0.1.0"
description = "Compiles UTHM Atlas survey exports into the campus map bundle"
authors = [{ name = "Schwi2807" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "shapely>=2.0",
  "pyproj>=3.6",
  "jsonschema>=4.20",
  "rfc3339-validator>=0.1",
  "msgpack>=1.0",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
